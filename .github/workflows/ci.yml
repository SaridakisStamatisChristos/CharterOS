name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: charteros
          POSTGRES_USER: charteros
          POSTGRES_PASSWORD: charteros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U charteros -d charteros"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    env:
      CHARTEROS_ENVIRONMENT: test
      CHARTEROS_SERVICE_NAME: charteros-api
      CHARTEROS_LOG_LEVEL: INFO
      CHARTEROS_DATABASE_URL: postgresql+psycopg://charteros:charteros@localhost:5432/charteros

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy apps charteros tests tools

      - name: Compose config
        run: docker compose config

      - name: Migration smoke
        run: alembic upgrade head

      - name: Tests
        run: pytest

      - name: App boot smoke
        run: python tools/app_boot_smoke.py
