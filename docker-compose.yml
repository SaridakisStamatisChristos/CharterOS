services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: charteros
      POSTGRES_USER: charteros
      POSTGRES_PASSWORD: charteros
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charteros -d charteros"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - charteros-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CHARTEROS_ENVIRONMENT: development
      CHARTEROS_SERVICE_NAME: charteros-api
      CHARTEROS_LOG_LEVEL: INFO
      CHARTEROS_DATABASE_URL: postgresql+psycopg://charteros:charteros@postgres:5432/charteros
      CHARTEROS_API_HOST: 0.0.0.0
      CHARTEROS_API_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  charteros-postgres:
