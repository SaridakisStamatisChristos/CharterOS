x-charteros-runtime-hardening: &charteros-runtime-hardening
  read_only: true
  init: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: charteros
      POSTGRES_USER: charteros
      POSTGRES_PASSWORD: ${CHARTEROS_DEV_POSTGRES_PASSWORD:-replace-with-random-local-password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charteros -d charteros"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - charteros-postgres:/var/lib/postgresql/data

  outbox-worker:
    <<: *charteros-runtime-hardening
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "apps.outbox_worker.main"]
    environment:
      CHARTEROS_ENVIRONMENT: development
      CHARTEROS_SERVICE_NAME: charteros-outbox-worker
      CHARTEROS_LOG_LEVEL: INFO
      CHARTEROS_DATABASE_URL: postgresql+psycopg://charteros:${CHARTEROS_DEV_POSTGRES_PASSWORD:-replace-with-random-local-password}@postgres:5432/charteros
      CHARTEROS_OUTBOX_BATCH_SIZE: 32
      CHARTEROS_OUTBOX_POLL_INTERVAL_SECONDS: 1.0
      CHARTEROS_OUTBOX_LEASE_SECONDS: 30
      CHARTEROS_OUTBOX_MAX_ATTEMPTS: 8
      CHARTEROS_OUTBOX_BACKOFF_BASE_SECONDS: 1
      CHARTEROS_OUTBOX_BACKOFF_MAX_SECONDS: 300
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *charteros-runtime-hardening
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CHARTEROS_ENVIRONMENT: development
      CHARTEROS_SERVICE_NAME: charteros-api
      CHARTEROS_LOG_LEVEL: INFO
      CHARTEROS_DATABASE_URL: postgresql+psycopg://charteros:${CHARTEROS_DEV_POSTGRES_PASSWORD:-replace-with-random-local-password}@postgres:5432/charteros
      CHARTEROS_API_HOST: 0.0.0.0
      CHARTEROS_API_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  charteros-postgres:
